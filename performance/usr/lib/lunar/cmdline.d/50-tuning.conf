# Lunar performance profile - kernel parameters
nmi_watchdog=0
nowatchdog
processor.max_cstate=1
transparent_hugepage=always
transparent_hugepage_tmpfs=always
audit=0
pcie_aspm=off
split_lock_detect=off
preempt=full
zswap.enabled=0
# The distro kernel is built for laptops too (idle tick, schedutil);
# these restore linux-lunar's desktop defaults: periodic tick, performance governor
nohz=off
cpufreq.default_governor=performance
