# Kernel command line settings, read by lunar-update-cmdline.
# After a change run:  sudo lunar-update-cmdline   (then reboot)
#
# The command line is built from, in this order:
#   1. /etc/lunar/cmdline-root          root options (written by the installer)
#   2. /usr/lib/lunar/cmdline.d/*.conf   Lunar's parameters
#   3. /etc/lunar/cmdline.d/*.conf       your own parameters (they come last,
#                                        so they win over Lunar's)
#
# yes: use Lunar's parameters (2)
# no:  leave them out; only the root options and your own files are used
LUNAR_DEFAULTS=yes
