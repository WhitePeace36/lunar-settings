# Environment for the graphical session (read by the systemd user manager).
# The same values are exported for TTY/SSH logins by /etc/profile.d/lunar-env.sh.
# Override in ~/.config/environment.d/*.conf.

LD_BIND_NOW=1
PAGER=most
EDITOR=micro
VISUAL=micro

# Shader caches. Each variable is ignored by the other vendor's driver.
MESA_SHADER_CACHE_MAX_SIZE=30G
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
