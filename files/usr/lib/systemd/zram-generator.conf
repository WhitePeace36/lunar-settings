# Lunar: compressed swap in RAM (zram), sized like the RAM itself.
# zstd packs typical desktop memory about 3:1, so this uses at most about a
# third of the RAM when full. vm.swappiness=150 (sysctl.d/70-lunar.conf)
# makes the kernel prefer it over dropping file cache.
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
