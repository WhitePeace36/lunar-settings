# Lunar kernel parameters. lunar-update-cmdline puts them after the root
# options from the installer (/etc/lunar/cmdline-root) and before the user's
# own files in /etc/lunar/cmdline.d, into /etc/kernel/cmdline and the
# systemd-boot entries. Parameters in /etc/lunar/cmdline.d win (they come
# last); LUNAR_DEFAULTS=no in /etc/lunar/cmdline.conf leaves this file out.
#
# The performance governor, the periodic tick and THP "always" are compiled
# into linux-lunar, so they aren't set here.

# quiet boot
loglevel=3
rd.systemd.show_status=false

# no watchdogs, no audit
nmi_watchdog=0
nowatchdog
audit=0

# CPU idle: only C1 (processor.* for acpi_idle, mostly AMD; intel_idle.* for Intel)
processor.max_cstate=1
intel_idle.max_cstate=1
# no PCIe link power saving
pcie_aspm=off
preempt=full

# memory: huge pages also for tmpfs mounts (/tmp, /dev/shm). This sets the
# default for tmpfs mounts, which the tmpfiles setting shmem_enabled (only
# the kernel's internal shared memory) doesn't cover.
transparent_hugepage_tmpfs=always
zswap.enabled=0

# misc
split_lock_detect=off
libahci.ignore_sss=1
