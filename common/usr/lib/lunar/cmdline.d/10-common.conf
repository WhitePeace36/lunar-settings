# Kernel parameters for every Lunar install, on top of the boot loader's own
# defaults (systemd-boot: "nowatchdog quiet splash"). The tuning profile adds
# its own list in 50-tuning.conf. Run lunar-update-cmdline after editing an
# override in /etc/lunar/cmdline.d/.

loglevel=3
rd.systemd.show_status=false
libahci.ignore_sss=1
