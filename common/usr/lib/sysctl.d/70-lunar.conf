# Lunar sysctl settings, shared by both tuning profiles.
# Profile-specific values live in 75-lunar-tuning.conf (lunar-tuning-*).
# Override any of these in /etc/sysctl.d/99-local.conf.

# --- Memory / swap (tuned for zram) ---
vm.swappiness = 150
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.zone_reclaim_mode = 0
vm.watermark_scale_factor = 500
# Same as linux-lunar's compiled-in default: the boost is a percentage of the
# high watermark, so it stays small when watermark_scale_factor is large.
# vm.defrag_mode is left to the kernel (linux-lunar: 1 with defrag_soft).
vm.watermark_boost_factor = 600
vm.page_lock_unfairness = 3
vm.stat_interval = 10
vm.max_map_count = 2147483642
vm.unprivileged_userfaultfd = 1
# Never refuse allocations; when memory really runs out the OOM killer acts
vm.overcommit_memory = 1

# --- Dirty page writeback ---
vm.dirty_bytes = 536870912
vm.dirty_background_bytes = 67108864

# --- Kernel ---
kernel.nmi_watchdog = 0
kernel.split_lock_mitigate = 0
kernel.threads-max = 1073741823
kernel.unprivileged_userns_clone = 1
kernel.kptr_restrict = 1
kernel.perf_event_paranoid = 0
kernel.printk = 3 3 2 3
kernel.printk_devkmsg = off
kernel.sysrq = 1

# --- Files ---
fs.file-max = 2097152
fs.inotify.max_queued_events = 65536

# --- Network ---
net.core.busy_read = 0
net.core.netdev_max_backlog = 16384
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 8388608
net.core.wmem_default = 8388608
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1
